      ctx.arc(px, py + 14, 10, Math.PI, 0);
      ctx.fill();

      // Head
      ctx.beginPath();
      ctx.arc(px, py, 5.5, 0, Math.PI * 2);
      ctx.fill();

      // Rim highlight from stage lights
      ctx.strokeStyle = `rgba(${col.r}, ${col.g}, ${col.b}, 0.45)`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(px, py, 5.5, Math.PI * 1.15, Math.PI * 1.85);
      ctx.stroke();

      // Waving Glowstick
      if (person.hasGlowstick && (state.hype > 25 || person.row >= 1)) {
        const waveAngle = -Math.PI / 2 + Math.sin(state.time * 9 + person.phase) * 0.65;
        const handX = px + 6;
        const handY = py - 2;
        const tipX = handX + Math.cos(waveAngle) * 11;
        const tipY = handY + Math.sin(waveAngle) * 11;

        ctx.strokeStyle = COLORS[person.stickColor].hex;
        ctx.lineWidth = 2.4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(handX, handY);
        ctx.lineTo(tipX, tipY);
        ctx.stroke();
      }
    });
  }

  // ==========================================
  // 7. UI CONTROLS & EVENT BINDINGS
  // ==========================================
  function setSpotlightColor(colorKey) {
    state.lightMode = colorKey;
    document.querySelectorAll('.color-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.color === colorKey);
    });
  }

  function updateLaserUI() {
    const btn = document.getElementById('btn-laser');
    const sub = document.getElementById('laser-status');
    btn.classList.toggle('on', state.lasersOn);
    sub.textContent = state.lasersOn ? 'ON' : 'OFF';
  }

  function updateSideLedUI() {
    const btn = document.getElementById('btn-side-led');
    const sub = document.getElementById('side-led-status');
    btn.classList.toggle('on', state.sideLedMode > 0);
    sub.textContent = SIDE_LED_MODES[state.sideLedMode];
  }

  function dismissPrompt() {
    const prompt = document.getElementById('tap-prompt');
    if (prompt && prompt.style.display !== 'none') {
      prompt.style.display = 'none';
      startMusic();
    }
  }

  document.getElementById('tap-prompt').addEventListener('pointerdown', (e) => {
    e.preventDefault();
    dismissPrompt();
  });

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    dismissPrompt();
    triggerBeatVisuals();
    registerPlayerAction(4);
  });

  // Spotlight Color Buttons
  document.querySelectorAll('.color-btn').forEach(btn => {
    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      dismissPrompt();
      setSpotlightColor(btn.dataset.color);
      registerPlayerAction(3);
    });
  });

  // Lasers Toggle
  document.getElementById('btn-laser').addEventListener('pointerdown', (e) => {
    e.preventDefault();
    dismissPrompt();
    state.lasersOn = !state.lasersOn;
    updateLaserUI();
    registerPlayerAction(4);
  });

  // Side Running LED Mode Switcher
  document.getElementById('btn-side-led').addEventListener('pointerdown', (e) => {
    e.preventDefault();
    dismissPrompt();
    state.sideLedMode = (state.sideLedMode + 1) % SIDE_LED_MODES.length;
    updateSideLedUI();
    registerPlayerAction(4);
  });

  // VJ Screen Mode Switcher
  document.getElementById('btn-vj').addEventListener('pointerdown', (e) => {
    e.preventDefault();
    dismissPrompt();
    state.vjMode = (state.vjMode + 1) % VJ_MODES.length;
    document.getElementById('vj-status').textContent = VJ_MODES[state.vjMode];
    registerPlayerAction(4);
  });

  // Hold Strobe Button
  const btnStrobe = document.getElementById('btn-strobe');
  const startStrobe = (e) => {
    e.preventDefault();
    dismissPrompt();
    state.strobeActive = true;
    btnStrobe.classList.add('pressed');
    registerPlayerAction(5);
  };
  const stopStrobe = () => {
    state.strobeActive = false;
    btnStrobe.classList.remove('pressed');
  };
  btnStrobe.addEventListener('pointerdown', startStrobe);
  btnStrobe.addEventListener('pointerup', stopStrobe);
  btnStrobe.addEventListener('pointerleave', stopStrobe);
  btnStrobe.addEventListener('pointercancel', stopStrobe);

  // Pyro & Smoke FX
  document.getElementById('btn-pyro').addEventListener('pointerdown', (e) => {
    e.preventDefault();
    dismissPrompt();
    triggerPyro();
  });

  document.getElementById('btn-smoke').addEventListener('pointerdown', (e) => {
    e.preventDefault();
    dismissPrompt();
    triggerSmoke();
  });

  // Audio Play/Pause
  document.getElementById('btn-play').addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const prompt = document.getElementById('tap-prompt');
    if (prompt) prompt.style.display = 'none';
    if (audio.isPlaying) {
      stopMusic();
    } else {
      startMusic();
    }
  });

  // Track Switcher (Midnight Sun / Festival Anthem / Disfigure - Blank)
  const btnTrack = document.getElementById('btn-track');
  btnTrack.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    dismissPrompt();
    const wasCustom = custom.active;
    if (wasCustom) deactivateCustom();
    state.trackIndex = (state.trackIndex + 1) % 3;
    if (state.trackIndex === 0) {
      btnTrack.innerHTML = '🎵 MIDNIGHT<br>SUN';
      audio.bpm = 122;
    } else if (state.trackIndex === 1) {
      btnTrack.innerHTML = '🎵 FESTIVAL<br>ANTHEM';
      audio.bpm = 128;
    } else {
      btnTrack.innerHTML = '🎵 BLANK<br>(NCS)';
      audio.bpm = 140;
    }
    audio.step = 0;
    document.getElementById('bpm-val').textContent = audio.bpm;
    restartSequencerTimer();
    if (wasCustom) startMusic();
  });

  // Auto Show Mode Toggle
  const btnAuto = document.getElementById('btn-auto');
  btnAuto.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    dismissPrompt();
    state.autoShow = !state.autoShow;
    btnAuto.classList.toggle('active', state.autoShow);
  });

  // BPM Adjusters
  document.getElementById('btn-bpm-down').addEventListener('pointerdown', (e) => {
    e.preventDefault();
    audio.bpm = Math.max(85, audio.bpm - 2);
    document.getElementById('bpm-val').textContent = audio.bpm;
    restartSequencerTimer();
  });

  document.getElementById('btn-bpm-up').addEventListener('pointerdown', (e) => {
    e.preventDefault();
    audio.bpm = Math.min(165, audio.bpm + 2);
    document.getElementById('bpm-val').textContent = audio.bpm;
    restartSequencerTimer();
  });

  // ==========================================
  // 8. ANIMATION LOOP & WINDOW LIFECYCLE
  // ==========================================
  // Load own music file from device
  const fileInput = document.getElementById('file-audio');
  document.getElementById('btn-file').addEventListener('click', () => {
    const p = document.getElementById('tap-prompt');
    if (p) p.style.display = 'none';
    fileInput.click();
  });
  fileInput.addEventListener('change', () => {
    const f = fileInput.files && fileInput.files[0];
    if (f) loadCustomFile(f);
    fileInput.value = '';
  });

  // LED Tubes & Spotlight fade controls
  const bindTap = (id, fn) => document.getElementById(id).addEventListener('pointerdown', (e) => {
    e.preventDefault(); dismissPrompt(); fn(); registerPlayerAction(3);
  });
  bindTap('btn-tube', () => {
    state.tubeMode = (state.tubeMode + 1) % TUBE_MODES.length;
    document.getElementById('tube-status').textContent = TUBE_MODES[state.tubeMode];
    document.getElementById('btn-tube').classList.toggle('on', state.tubeMode > 0);
  });
  bindTap('btn-tube-speed', () => {
    state.tubeSpeed = (state.tubeSpeed + 1) % TUBE_SPEEDS.length;
    document.getElementById('tube-speed-status').textContent = TUBE_SPEEDS[state.tubeSpeed].n;
  });
  bindTap('btn-tube-col', () => {
    state.tubeColor = (state.tubeColor + 1) % TUBE_COLS.length;
    document.getElementById('tube-col-status').textContent = TUBE_COLS[state.tubeColor];
  });
  bindTap('btn-bg', () => {
    state.bgOn = !state.bgOn;
    document.getElementById('btn-bg').classList.toggle('on', state.bgOn);
    document.getElementById('bg-status').textContent = state.bgOn ? 'ON' : 'OFF';
  });
  bindTap('btn-spot', () => {
    state.spotOn = !state.spotOn;
    document.getElementById('btn-spot').classList.toggle('on', state.spotOn);
    document.getElementById('spot-status').textContent = state.spotOn ? 'ON' : 'OFF';
  });

  let lastFrameTime = performance.now();

  function animate(now) {
    const dt = Math.min(0.05, (now - lastFrameTime) / 1000);
    lastFrameTime = now;
    drawStage(dt);
    requestAnimationFrame(animate);
  }

  window.addEventListener('resize', resizeCanvas);

  window.onload = function () {
    resizeCanvas();
    updateHypeUI();
    updateSideLedUI();
    updateLaserUI();
    lastFrameTime = performance.now();
    requestAnimationFrame(animate);
  };
})();
</script>
</body>
</html>
